<!DOCTYPE html>
<!-- PixelSoftwareDesign2026@ -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iner Studio — Connexion</title>
<meta name="description" content="Accédez à Iner Studio, le studio 3D d'aménagement d'intérieur : identifiez-vous avec votre compte Pixel Software Design.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://iner.pixelsoftwaredesign.xyz/login/">
<meta name="theme-color" content="#151719">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { color-scheme: dark;
    --bg:#151719; --panel:#1e2124; --surface:#1e2124; --border:#353a40; --line:#353a40;
    --text:#edece7; --muted:#8b9098; --accent:#35b49c; --danger:#d76868; --input:#111315; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: auto;
    background: radial-gradient(900px 500px at 50% -10%, rgba(53,180,156,.14), transparent 60%), var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    isolation: isolate;
  }
  .geo-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .g { position: absolute; opacity: .05; will-change: transform, translate; backface-visibility: visible; }
  .g1 { width: 110px; height: 110px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: var(--accent); left: 8%; top: 14%; animation: gSX 30s linear infinite, gD1 22s ease-in-out infinite; }
  .g2 { width: 70px; height: 70px; clip-path: polygon(50% 0%, 100% 100%, 0% 100%); background: #e7c46a; right: 12%; bottom: 20%; animation: gSY 24s linear infinite, gD2 18s ease-in-out infinite; }
  .g3 { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); right: 18%; top: 30%; animation: gSZ 20s linear infinite reverse, gD3 26s ease-in-out infinite; }
  .g4 { width: 60px; height: 60px; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); background: #e7c46a; left: 18%; bottom: 15%; animation: gSX 26s linear infinite, gD1 20s ease-in-out infinite reverse; }
  @keyframes gSX { from { transform: rotateX(0) rotateZ(12deg); } to { transform: rotateX(360deg) rotateZ(12deg); } }
  @keyframes gSY { from { transform: rotateY(0) rotateX(8deg); } to { transform: rotateY(360deg) rotateX(8deg); } }
  @keyframes gSZ { from { transform: rotateZ(0) rotateY(10deg); } to { transform: rotateZ(360deg) rotateY(10deg); } }
  @keyframes gD1 { 0%,100% { translate: 0 0; } 50% { translate: 20px -18px; } }
  @keyframes gD2 { 0%,100% { translate: 0 0; } 50% { translate: -16px 14px; } }
  @keyframes gD3 { 0%,100% { translate: 0 0; } 33% { translate: 12px 10px; } 66% { translate: -10px -8px; } }
  .geo3d { position: absolute; opacity: .1; will-change: transform; backface-visibility: visible; }
  .geo3d .c1, .geo3d.c1 { --s: 24px; width: calc(var(--s)*2); height: calc(var(--s)*2); transform-style: preserve-3d; left: 72%; bottom: 16%; animation: gCubeA 26s linear infinite; }
  .geo3d i { position: absolute; inset: 0; background: color-mix(in srgb, var(--accent) 16%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); }
  .geo3d i:nth-child(1) { transform: translateZ(var(--s)); }
  .geo3d i:nth-child(2) { transform: rotateY(180deg) translateZ(var(--s)); }
  .geo3d i:nth-child(3) { transform: rotateY(90deg) translateZ(var(--s)); }
  .geo3d i:nth-child(4) { transform: rotateY(-90deg) translateZ(var(--s)); }
  .geo3d i:nth-child(5) { transform: rotateX(90deg) translateZ(var(--s)); }
  .geo3d i:nth-child(6) { transform: rotateX(-90deg) translateZ(var(--s)); }
  .geo3d.s1 { width: 62px; height: 62px; left: 10%; top: 12%; border-radius: 50%; background: radial-gradient(closest-side at 34% 30%, #8cebd8, #35b49c 44%, #1c6b5b 70%, #0d4438 100%); box-shadow: inset -8px -10px 20px rgba(0,0,0,.45), 0 3px 14px rgba(0,0,0,.35); animation: gSphere 8s ease-in-out infinite; }
  @keyframes gCubeA { from { transform: rotateX(-10deg) rotateY(0deg); } to { transform: rotateX(350deg) rotateY(360deg); } }
  @keyframes gSphere { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
  @media (prefers-reduced-motion: reduce) { .g, .geo3d { animation: none !important; } }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .login-logo { text-align: center; margin-bottom: 8px; }
  .login-title { text-align: center; font-size: 1.25rem; margin: 4px 0 6px; }
  .login-sub { text-align: center; color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.6; }
  .login-back { display:block; text-align:center; font-size:.8rem; color: var(--muted); margin-bottom: 18px; text-decoration: none; }
  .login-back:hover { color: var(--accent); }
  .login-card .field { margin-bottom: 16px; }
  .login-card label { display: block; margin-bottom: 6px; font-size: .85rem; color: var(--muted); }
  .login-card input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input);
    color: var(--text);
    font-size: .95rem;
  }
  .login-card input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
  .login-error { color: var(--danger); font-size: .85rem; min-height: 20px; margin-bottom: 12px; text-align: center; }
  .btn-login {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #07100e;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-login:hover { background: #41c7ad; }
  .btn-login:disabled { opacity: .6; cursor: wait; }
  .login-note { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="geo-bg" aria-hidden="true">
    <i class="g g1"></i><i class="g g2"></i><i class="g g3"></i><i class="g g4"></i>
    <div class="geo3d geo-cube c1"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="geo3d geo-sphere s1"></div>
  </div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo"><img src="/logo.svg" alt="Iner Studio" style="height:64px;width:auto;margin-bottom:8px;" /></div>
      <a class="login-back" href="/">← Retour au site</a>
      <h1 class="login-title">Iner Studio</h1>
      <p class="login-sub">Connecte-toi avec ton compte<br>Pixel Software Design.</p>
      <form id="loginForm">
        <div class="field">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" name="username" placeholder="votre identifiant" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
        </div>
        <div id="loginError" class="login-error"></div>
        <button type="submit" class="btn-login" id="loginBtn">Se connecter</button>
      </form>
      <p class="login-note">Vous n'avez pas de compte ? Créez-en un sur <a href="https://pixelsoftwaredesign.xyz/" target="_blank" rel="noopener">pixelsoftwaredesign.xyz</a>.</p>
    </div>
  </div>
<script>
(function () {
  const form = document.getElementById("loginForm");
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("loginError");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Connexion...";
    try {
      const resp = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && data.status === "success") {
        window.location.href = "/studio/";
      } else {
        err.textContent = data.error || "Connexion refusée.";
      }
    } catch (e) {
      err.textContent = "Erreur de connexion au serveur.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Se connecter";
    }
  });
})();
</script>
</body>
</html>
