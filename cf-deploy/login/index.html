<!DOCTYPE html>
<!-- PixelSoftwareDesign2026@ -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inerre Studio — Connexion</title>
<meta name="description" content="Accédez à Inerre Studio, le studio 3D d'aménagement d'intérieur : identifiez-vous avec votre compte Pixel Software Design.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://iner.pixelsoftwaredesign.xyz/login/">
<meta name="theme-color" content="#151719">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { color-scheme: dark;
    --bg:#151719; --panel:#1e2124; --surface:#1e2124; --border:#353a40; --line:#353a40;
    --text:#edece7; --muted:#8b9098; --accent:#35b49c; --danger:#d76868; --input:#111315; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: auto;
    background: radial-gradient(900px 500px at 50% -10%, rgba(53,180,156,.14), transparent 60%), var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .login-logo { text-align: center; margin-bottom: 8px; }
  .login-title { text-align: center; font-size: 1.25rem; margin: 4px 0 6px; }
  .login-sub { text-align: center; color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.6; }
  .login-back { display:block; text-align:center; font-size:.8rem; color: var(--muted); margin-bottom: 18px; text-decoration: none; }
  .login-back:hover { color: var(--accent); }
  .login-card .field { margin-bottom: 16px; }
  .login-card label { display: block; margin-bottom: 6px; font-size: .85rem; color: var(--muted); }
  .login-card input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input);
    color: var(--text);
    font-size: .95rem;
  }
  .login-card input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
  .login-error { color: var(--danger); font-size: .85rem; min-height: 20px; margin-bottom: 12px; text-align: center; }
  .btn-login {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #07100e;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-login:hover { background: #41c7ad; }
  .btn-login:disabled { opacity: .6; cursor: wait; }
  .login-note { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo"><img src="/logo.svg" alt="Inerre Studio" style="height:64px;width:auto;margin-bottom:8px;" /></div>
      <a class="login-back" href="/">← Retour au site</a>
      <h1 class="login-title">Inerre Studio</h1>
      <p class="login-sub">Connecte-toi avec ton compte<br>Pixel Software Design.</p>
      <form id="loginForm">
        <div class="field">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" name="username" placeholder="votre identifiant" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
        </div>
        <div id="loginError" class="login-error"></div>
        <button type="submit" class="btn-login" id="loginBtn">Se connecter</button>
      </form>
      <p class="login-note">Vous n'avez pas de compte ? Créez-en un sur <a href="https://pixelsoftwaredesign.xyz/" target="_blank" rel="noopener">pixelsoftwaredesign.xyz</a>.</p>
    </div>
  </div>
<script>
(function () {
  const form = document.getElementById("loginForm");
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("loginError");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Connexion...";
    try {
      const resp = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && data.status === "success") {
        window.location.href = "/studio/";
      } else {
        err.textContent = data.error || "Connexion refusée.";
      }
    } catch (e) {
      err.textContent = "Erreur de connexion au serveur.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Se connecter";
    }
  });
})();
</script>
</body>
</html>
