<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inerre Studio — Connexion</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body { overflow: auto; }
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .login-logo { text-align: center; margin-bottom: 8px; font-size: 34px; }
  .login-title { text-align: center; font-size: 1.25rem; margin-bottom: 6px; }
  .login-sub { text-align: center; color: var(--muted); font-size: .85rem; margin-bottom: 24px; line-height: 1.6; }
  .login-card .field { margin-bottom: 16px; }
  .login-card label { display: block; margin-bottom: 6px; font-size: .85rem; color: var(--muted); }
  .login-card input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: .95rem;
  }
  .login-card input:focus { outline: none; border-color: var(--accent); }
  .login-error { color: #FF6B6B; font-size: .85rem; min-height: 20px; margin-bottom: 12px; text-align: center; }
  .btn-login {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-login:disabled { opacity: .6; cursor: wait; }
  .login-note { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">🏠</div>
      <h1 class="login-title">Inerre Studio</h1>
      <p class="login-sub">Connecte-toi avec ton compte<br>Pixel Software Design.</p>
      <form id="loginForm">
        <div class="field">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" name="username" placeholder="votre identifiant" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
        </div>
        <div id="loginError" class="login-error"></div>
        <button type="submit" class="btn-login" id="loginBtn">Se connecter</button>
      </form>
      <p class="login-note">Vous n'avez pas de compte ? Créez-en un sur <a href="https://pixelsoftwaredesign.xyz/" target="_blank" rel="noopener">pixelsoftwaredesign.xyz</a>.</p>
    </div>
  </div>
<script>
(function () {
  const form = document.getElementById("loginForm");
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("loginError");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Connexion...";
    try {
      const resp = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && data.status === "success") {
        window.location.href = "/";
      } else {
        err.textContent = data.error || "Connexion refusée.";
      }
    } catch (e) {
      err.textContent = "Erreur de connexion au serveur.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Se connecter";
    }
  });
})();
</script>
</body>
</html>
