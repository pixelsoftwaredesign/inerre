<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <defs>
    <linearGradient id="geo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44c8ae"/>
      <stop offset="1" stop-color="#1f8a76"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44c8ae"/>
      <stop offset="1" stop-color="#1f8a76"/>
    </linearGradient>
  </defs>

  <!-- hexagon mark (animated geometric vector) -->
  <g transform="translate(82 80)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 0 0; 6 0 0; -6 0 0" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
      <!-- hexagon ring -->
      <polygon points="0,-58 50.2,-29 50.2,29 0,58 -50.2,29 -50.2,-29" fill="none" stroke="url(#geo)" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- inner fill -->
      <polygon points="0,-43 37.2,-21.5 37.2,21.5 0,43 -37.2,21.5 -37.2,-21.5" fill="url(#geo)" opacity=".12"/>
      <!-- triangle core (slow rotation) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" dur="28s" repeatCount="indefinite"/>
        <polygon points="0,-38 33,22 -33,22" fill="url(#geo)" opacity=".85"/>
      </g>
    </g>
    <!-- orbiting golden dot -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" dur="4s" repeatCount="indefinite"/>
      <circle cx="0" cy="-58" r="6" fill="#e7c46a"/>
    </g>
  </g>

  <text x="155" y="72" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#edece7" letter-spacing="-1">Iner</text>
  <text x="155" y="108" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#888d92" letter-spacing="4">STUDIO</text>
  <rect x="155" y="120" width="56" height="3" rx="1.5" fill="url(#bar)">
    <animate attributeName="opacity" values=".45;1;.45" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>