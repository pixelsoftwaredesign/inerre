<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f21"/>
      <stop offset="1" stop-color="#121415"/>
    </linearGradient>
    <linearGradient id="geo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44c8ae"/>
      <stop offset="1" stop-color="#1f8a76"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="none" stroke="#2a2f33" stroke-width="3"/>

  <!-- hexagon ring (subtle oscillation) -->
  <g transform="translate(256 262)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 0 0; 5 0 0; -5 0 0" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
      <polygon points="0,-152 131.6,-76 131.6,76 0,152 -131.6,76 -131.6,-76" fill="none" stroke="url(#geo)" stroke-width="10" stroke-linejoin="round"/>
      <polygon points="0,-114 98.7,-57 98.7,57 0,114 -98.7,57 -98.7,-57" fill="url(#geo)" opacity=".15"/>
      <!-- triangle core (slow continuous rotation) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" dur="28s" repeatCount="indefinite"/>
        <polygon points="0,-90 78,50 -78,50" fill="url(#geo)" opacity=".85"/>
      </g>
    </g>
    <!-- orbiting golden dot -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" dur="4s" repeatCount="indefinite"/>
      <circle cx="0" cy="-152" r="18" fill="#e7c46a"/>
    </g>
  </g>
</svg>