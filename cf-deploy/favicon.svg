<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f21"/>
      <stop offset="1" stop-color="#121415"/>
    </linearGradient>
    <linearGradient id="i" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44c8ae"/>
      <stop offset="1" stop-color="#2a9c86"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="none" stroke="#2a2f33" stroke-width="3"/>

  <!-- Isometric room corner -->
  <g transform="translate(256 292)">
    <!-- floor -->
    <polygon points="0,0 -122,61 0,122 122,61" fill="#35b49c25"/>
    <polygon points="0,0 -122,61 0,122 122,61" fill="none" stroke="#35b49c" stroke-width="6" stroke-linejoin="round"/>
    <!-- right wall -->
    <polygon points="0,0 122,61 122,-95 0,-156" fill="#35b49c14"/>
    <polygon points="0,0 122,61 122,-95 0,-156" fill="none" stroke="#35b49c" stroke-width="6" stroke-linejoin="round"/>
    <!-- left wall -->
    <polygon points="0,0 -122,61 -122,-95 0,-156" fill="#e7c46a14"/>
    <polygon points="0,0 -122,61 -122,-95 0,-156" fill="none" stroke="#e7c46a" stroke-width="6" stroke-linejoin="round"/>
    <!-- gold accent line on floor -->
    <line x1="-122" y1="61" x2="0" y2="122" stroke="#e7c46a" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="122" x2="122" y2="61" stroke="#35b49c" stroke-width="6" stroke-linecap="round"/>
    <!-- center corner line -->
    <line x1="0" y1="0" x2="0" y2="-156" stroke="#edece7" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- door-like I frame -->
  <g transform="translate(256 150)">
    <rect x="-38" y="0" width="76" height="110" rx="10" fill="none" stroke="#edece7" stroke-width="10"/>
    <rect x="-38" y="0" width="76" height="110" rx="10" fill="#151719cc"/>
    <circle cx="20" cy="96" r="5" fill="#e7c46a"/>
  </g>
</svg>